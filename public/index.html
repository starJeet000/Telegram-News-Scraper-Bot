<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morning Chaos Briefing</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --link: #60a5fa;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 720px;
      width: 100%;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.75rem;
      margin: 0 0 0.5rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .timestamp {
      color: var(--muted);
      font-size: 0.875rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .briefing p {
      margin-top: 0;
      margin-bottom: 1rem;
      white-space: pre-line;
    }

    .briefing p:last-child {
      margin-bottom: 0;
    }

    h2 {
      font-size: 1.25rem;
      color: var(--accent);
      margin-top: 2rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    ol {
      padding-left: 1.25rem;
      margin: 0;
    }

    li {
      margin-bottom: 0.75rem;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .badge {
      display: inline-block;
      background: var(--border);
      color: var(--muted);
      font-size: 0.75rem;
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      margin-right: 0.4rem;
      font-weight: 600;
    }

    .loading {
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>☕ Morning Chaos Briefing</h1>
      <div class="timestamp" id="updated-at">Fetching latest dispatch...</div>
    </header>

    <main class="card">
      <div id="briefing-content" class="briefing">
        <p class="loading">Loading briefing content...</p>
      </div>

      <h2>The Evidence</h2>
      <ol id="evidence-list">
        <li class="loading">Loading sources...</li>
      </ol>
    </main>
  </div>

  <script>
    async function loadBriefing() {
      try {
        const response = await fetch('./briefing.json');
        if (!response.ok) throw new Error('Briefing data unavailable');
        const data = await response.json();

        // Render timestamp
        const date = new Date(data.updatedAt);
        document.getElementById('updated-at').textContent = `Last Updated: ${date.toLocaleString()}`;

        // Render briefing text
        const briefingEl = document.getElementById('briefing-content');
        briefingEl.innerHTML = data.briefing
          .split('\n\n')
          .map(p => `<p>${p.trim()}</p>`)
          .join('');

        // Render evidence links
        const evidenceEl = document.getElementById('evidence-list');
        evidenceEl.innerHTML = data.evidence
          .map(item => `
            <li>
              <span class="badge">${item.source}</span>
              <a href="${item.url}" target="_blank" rel="noopener noreferrer">${item.title}</a>
            </li>
          `)
          .join('');
      } catch (err) {
        document.getElementById('briefing-content').innerHTML = '<p style="color: #ef4444;">Failed to load the latest briefing. Ensure briefing.json exists in public/.</p>';
        document.getElementById('evidence-list').innerHTML = '';
      }
    }

    loadBriefing();
  </script>
</body>

</html>
