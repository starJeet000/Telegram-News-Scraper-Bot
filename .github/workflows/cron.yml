name: Morning Daily Digest

on:
  schedule:
    - cron: "30 2 * * *" # Runs daily at 02:30 UTC (8:00 AM IST)
  workflow_dispatch:

# Grant permission for the bot to push commits
permissions:
  contents: write

jobs:
  run-scraper-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Execute Scraper Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start

      - name: Push to Live Dashboard Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B live-dashboard
          # Force add public folder since it is in our .gitignore
          git add public/ -f
          git commit -m "chore: automated daily dashboard update" || echo "No changes to commit"
          git push origin live-dashboard --force
