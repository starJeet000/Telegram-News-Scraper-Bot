name: Morning Chaos Routine

on:
  schedule:
    # Runs at 02:30 UTC every day (which translates perfectly to 08:00 AM IST)
    - cron: "30 2 * * *"
  workflow_dispatch: # This magical line adds a "Run workflow" button in GitHub so you can test it manually

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Ensures we have access to the native fetch API

      - name: Install Dependencies
        run: npm ci # 'ci' is faster and stricter than 'install' for server environments

      - name: Wake Up Dwight
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/chaos-agent.js
